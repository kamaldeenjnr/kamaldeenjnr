name: Contribution snake

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#C4412B&color_dots=#ebedf0,#C9D1DC,#7F95B3,#1C3A63,#0C203B
            dist/snake-dark.svg?palette=github-dark&color_snake=#E8573F&color_dots=#161b22,#132B4D,#1C3A63,#3D6399,#AFC0D6
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
