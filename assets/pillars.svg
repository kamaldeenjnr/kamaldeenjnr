<text x="32" y="122" class="sans" font-size="25" font-weight="700" fill="#FFFFFF">Statistics &amp; modelling</text>
<text x="32" y="158" class="sans" font-size="16.5" fill="#B7C3D3">Models built to survive review: the</text>
<text x="32" y="182" class="sans" font-size="16.5" fill="#B7C3D3">right method, checked assumptions,</text>
<text x="32" y="206" class="sans" font-size="16.5" fill="#B7C3D3">validated against real data.</text>
