<text x="808" y="56" text-anchor="end" class="mono" font-size="15" fill="#5E7392">02</text>
<text x="472" y="122" class="sans" font-size="25" font-weight="700" fill="#FFFFFF">Maps &amp; spatial data</text>
<text x="472" y="158" class="sans" font-size="16.5" fill="#B7C3D3">Geospatial epidemiology that turns</text>
<text x="472" y="182" class="sans" font-size="16.5" fill="#B7C3D3">data into a clear answer: where the</text>
<text x="472" y="206" class="sans" font-size="16.5" fill="#B7C3D3">burden is, and where to act first.</text>
