<rect x="274.2" y="262" width="93" height="30" rx="15" fill="#132B4D" stroke="#24456F"/><text x="321" y="282" text-anchor="middle" class="mono" font-size="13.5" fill="#D6DEE8">Survival</text>
<rect x="32" y="302" width="119" height="30" rx="15" fill="#132B4D" stroke="#24456F"/><text x="91" y="322" text-anchor="middle" class="mono" font-size="13.5" fill="#D6DEE8">Risk models</text>
<rect x="158.6" y="302" width="110" height="30" rx="15" fill="#132B4D" stroke="#24456F"/><text x="214" y="322" text-anchor="middle" class="mono" font-size="13.5" fill="#D6DEE8">Validation</text>
</g>
<g class="c" style="animation-delay:0.15s"><rect x="441" y="1" width="398" height="388" rx="18" fill="#0C203B" stroke="#1C3A63" stroke-width="2"/>
