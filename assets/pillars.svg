<text x="912" y="158" class="sans" font-size="16.5" fill="#B7C3D3">Full-stack web apps, dashboards and</text>
<text x="912" y="182" class="sans" font-size="16.5" fill="#B7C3D3">sites that clients run themselves:</text>
<text x="912" y="206" class="sans" font-size="16.5" fill="#B7C3D3">payments, maps, logins and all.</text>
