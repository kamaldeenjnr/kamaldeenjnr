<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="184" viewBox="0 0 1280 184" role="img" aria-label="Now building QuantAI. Latest: an opportunities board for Ghanaians. Open to data analysis and web projects.">
<style>.sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.n{opacity:0;animation:up .7s ease-out forwards}.pulse{animation:pl 2s ease-in-out infinite}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes pl{50%{opacity:.35}}@media (prefers-reduced-motion:reduce){.n,.pulse{animation:none;opacity:1}}</style>
<rect x="1" y="1" width="1278" height="182" rx="18" fill="#0C203B" stroke="#1C3A63" stroke-width="2"/>
