<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="SafeWatch architecture: an SOS from the Android app, browser app, SMS or a USSD dial code reaches a FastAPI and PostgreSQL server, which sends it to the on-duty responder, then the backup and coordinator if nobody accepts, and to the nearest responder sharing their location. A dispatch screen handles the alert. Trip check-ins, hourly storm warnings and an audit log run alongside.">
<defs><marker id="a-9198a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9198a1"/></marker><marker id="a-F08A74" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F08A74"/></marker></defs><rect width="960" height="560" rx="10" fill="#0d1117" stroke="#30363d"/>
<text x="28" y="40" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.5" fill="#9198a1">1  REPORT FROM ANY PHONE</text>
<rect x="28" y="56" width="196" height="54" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="42" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Android app</text>
<text x="42" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9198a1">one-tap SOS with GPS</text>
<line x1="224" y1="83" x2="300" y2="170" stroke="#9198a1" stroke-width="1.4" marker-end="url(#a-9198a1)"/>
<rect x="28" y="122" width="196" height="54" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="42" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Browser app</text>
<text x="42" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9198a1">installs from a link</text>
<line x1="224" y1="149" x2="300" y2="170" stroke="#9198a1" stroke-width="1.4" marker-end="url(#a-9198a1)"/>
<rect x="28" y="188" width="196" height="54" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="42" y="212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">SMS</text>
<text x="42" y="232" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9198a1">when there is no data</text>
<line x1="224" y1="215" x2="300" y2="170" stroke="#9198a1" stroke-width="1.4" marker-end="url(#a-9198a1)"/>
<rect x="28" y="254" width="196" height="54" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="42" y="278" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">USSD dial code</text>
<text x="42" y="298" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9198a1">phones without internet</text>
<line x1="224" y1="281" x2="300" y2="170" stroke="#9198a1" stroke-width="1.4" marker-end="url(#a-9198a1)"/>
<text x="300" y="40" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.5" fill="#9198a1">2  SERVER</text>
<rect x="300" y="120" width="220" height="112" rx="6" fill="#1C3A63" stroke="#1C3A63"/>
<text x="314" y="144" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#ffffff">FastAPI · PostgreSQL</text>
<text x="314" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#AFC0D6">alert stored with location</text>
<text x="314" y="181" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#AFC0D6">and the reporter's choice:</text>
<text x="314" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#AFC0D6">drowning, boat, missing, other</text>
<text x="300" y="262" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#F08A74">saved → sent → received → accepted</text>
<text x="300" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#9198a1">a named person must accept it</text>
<text x="580" y="40" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.5" fill="#9198a1">3  ESCALATE UNTIL ACCEPTED</text>
<rect x="580" y="56" width="210" height="54" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="594" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">On-duty responder</text>
<text x="594" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9198a1">for that stretch of water</text>
<rect x="580" y="150" width="210" height="44" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="594" y="177.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Backup responder</text>
<rect x="580" y="228" width="210" height="44" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="594" y="255.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Coordinator</text>
<line x1="520" y1="160" x2="578" y2="83" stroke="#F08A74" stroke-width="1.4" marker-end="url(#a-F08A74)"/>
<line x1="685" y1="110" x2="685" y2="148" stroke="#F08A74" stroke-width="1.4" marker-end="url(#a-F08A74)"/>
<text x="693" y="134" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#F08A74">no answer in time</text>
<line x1="685" y1="194" x2="685" y2="226" stroke="#F08A74" stroke-width="1.4" marker-end="url(#a-F08A74)"/>
<text x="693" y="214" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#F08A74">still no answer</text>
<rect x="580" y="296" width="210" height="54" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="594" y="320" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Nearest responder</text>
<text x="594" y="340" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9198a1">sharing their location</text>
<line x1="520" y1="200" x2="578" y2="322" stroke="#9198a1" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#a-9198a1)"/>
<text x="816" y="40" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.5" fill="#9198a1">4  RESPOND</text>
<rect x="816" y="120" width="118" height="112" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="830" y="144" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Dispatch</text>
<text x="830" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9198a1">accept</text>
<text x="830" y="181" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9198a1">nearest landing</text>
<text x="830" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9198a1">same-accident</text>
<text x="830" y="215" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9198a1">check</text>
<line x1="790" y1="83" x2="814" y2="150" stroke="#9198a1" stroke-width="1.4" marker-end="url(#a-9198a1)"/>
<line x1="28" y1="384" x2="932" y2="384" stroke="#30363d"/>
<text x="28" y="412" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.5" fill="#9198a1">RUNNING ALONGSIDE</text>
<rect x="28" y="426" width="290" height="104" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="42" y="450" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Trip check-in</text>
<text x="42" y="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9198a1">fisher sets a return time;</text>
<text x="42" y="487" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9198a1">no check-in → alert with</text>
<text x="42" y="504" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9198a1">last known position</text>
<rect x="330" y="426" width="290" height="104" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="344" y="450" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Storm warnings</text>
<text x="344" y="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9198a1">forecast checked hourly;</text>
<text x="344" y="487" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9198a1">draft in Ewe, Twi, English</text>
<text x="344" y="504" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9198a1">for staff to send by SMS</text>
<rect x="632" y="426" width="290" height="104" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="646" y="450" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Audit log</text>
<text x="646" y="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9198a1">every step recorded with</text>
<text x="646" y="487" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9198a1">who did it and when, for</text>
<text x="646" y="504" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9198a1">partner and funder reports</text>
<line x1="126" y1="426" x2="306" y2="236" stroke="#F08A74" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#a-F08A74)"/>
</svg>